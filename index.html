<style>
    /* ตั้งค่าให้ container เป็นแบบตาราง 2 คอลัมน์ */
    .admin-tools-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* แบ่งเป็น 2 ส่วนเท่าๆ กัน */
        gap: 10px; /* ระยะห่างระหว่างปุ่ม 10px */
        width: 100%;
        margin-top: 15px;
    }

    /* ปรับให้ปุ่มแต่ละอันขยายเต็มพื้นที่ของตัวเอง */
    .admin-tools-container .modern-btn {
        width: 100%;
        margin: 0; 
        box-sizing: border-box;
    }
</style>

<div class="admin-tools-container">
    <button class="modern-btn btn-logout" onclick="logoutApp()">🚪 ออกจากระบบ</button>
    <button class="modern-btn btn-backup" onclick="openBackupModal()">💾 สำรองข้อมูล</button>
    <button class="modern-btn btn-clear" onclick="resetBoard()">🗑️ ล้างแผงนี้</button>
    <button class="modern-btn btn-customer" onclick="openCardSlider()">💕 สรุปลูกค้า</button>
    <button class="modern-btn btn-bg" onclick="openBgSelector()">🖼️ พื้นหลัง</button>
    <button class="modern-btn btn-theme" onclick="openGridDesignModal()">🎨 ธีมตาราง</button>
    <button id="btnToggleEdit" class="modern-btn btn-layout" onclick="toggleEditMode()">🔧 จัดวาง</button>
    <button id="btnFilterNum" class="modern-btn btn-filter" onclick="toggleFilterBooked()">🔍 ซ่อนเลขจอง</button>
    <button id="btnToggleMode" class="modern-btn btn-mode" onclick="toggleDisplayMode()">🔠 โหมด (10-19)</button>
    <button class="modern-btn btn-summary" onclick="openSummaryModal()">📊 สรุปยอด</button> 
</div>
